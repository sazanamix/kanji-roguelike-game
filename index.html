<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢字ローグ ― 全自動探索シミュレーション</title>
<meta name="description" content="自分も敵も宝もすべて漢字一文字。全自動で99階の迷宮に挑み続けるローグライク・シミュレーション。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230b0c0e'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%237fe0c4' font-family='sans-serif'%3E%E5%8B%87%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <header class="app-header">
    <div class="app-title-group">
      <h1>漢字ローグ</h1>
      <p class="subtitle">全自動探索シミュレーション ― 迷宮99階への挑戦</p>
    </div>
    <div class="controls" id="controls">
      <button type="button" id="btn-pause" class="btn">一時停止</button>
      <button type="button" id="btn-speed" class="btn">速度 x1</button>
      <button type="button" id="btn-save" class="btn">セーブ</button>
      <button type="button" id="btn-load" class="btn">ロード</button>
      <button type="button" id="btn-reset" class="btn btn-danger">リセット</button>
    </div>
  </header>

  <main class="main-layout">
    <section class="dungeon-panel">
      <div class="dungeon-viewport" id="dungeon-viewport">
        <div class="dungeon-grid" id="dungeon-grid" aria-hidden="true"></div>
      </div>
      <section class="panel-block message-panel" aria-label="冒険の記録">
        <h2>冒険の記録</h2>
        <div class="message-log" id="message-log"></div>
      </section>
    </section>

    <aside class="side-panel">
      <section class="panel-block" aria-label="ステータス">
        <h2>ステータス</h2>
        <div class="stat-row"><span class="stat-label">階層</span><span id="stat-floor" class="stat-value">1 / 99</span></div>
        <div class="stat-row"><span class="stat-label">ターン</span><span id="stat-turn" class="stat-value">0</span></div>
        <div class="stat-row">
          <span class="stat-label">HP</span>
          <span class="bar hp-bar"><span id="stat-hp-bar" class="bar-fill"></span></span>
          <span id="stat-hp-text" class="stat-value">20 / 20</span>
        </div>
        <div class="stat-row"><span class="stat-label">Lv</span><span id="stat-level" class="stat-value">1</span></div>
        <div class="stat-row">
          <span class="stat-label">EXP</span>
          <span class="bar exp-bar"><span id="stat-exp-bar" class="bar-fill"></span></span>
          <span id="stat-exp-text" class="stat-value">0 / 0</span>
        </div>
        <div class="stat-row"><span class="stat-label">攻撃</span><span id="stat-atk" class="stat-value">3</span></div>
        <div class="stat-row"><span class="stat-label">防御</span><span id="stat-def" class="stat-value">1</span></div>
        <div class="stat-row">
          <span class="stat-label">満腹</span>
          <span class="bar hunger-bar"><span id="stat-hunger-bar" class="bar-fill"></span></span>
          <span id="stat-hunger-text" class="stat-value">100 / 100</span>
        </div>
        <div class="stat-row"><span class="stat-label">所持金</span><span id="stat-gold" class="stat-value">0</span></div>
        <div class="stat-row"><span class="stat-label">撃破数</span><span id="stat-kills" class="stat-value">0</span></div>
      </section>

      <section class="panel-block" aria-label="記録">
        <h2>記録</h2>
        <div class="stat-row"><span class="stat-label">最高到達階</span><span id="stat-best-floor" class="stat-value">0</span></div>
        <div class="stat-row"><span class="stat-label">総冒険回数</span><span id="stat-total-runs" class="stat-value">0</span></div>
        <div class="stat-row"><span class="stat-label">総クリア回数</span><span id="stat-total-clears" class="stat-value">0</span></div>
      </section>

      <section class="panel-block" aria-label="装備">
        <h2>装備</h2>
        <div class="stat-row"><span class="stat-label">武器</span><span id="equip-weapon-value" class="stat-value">なし</span></div>
        <div class="stat-row"><span class="stat-label">防具</span><span id="equip-armor-value" class="stat-value">なし</span></div>
        <div class="stat-row"><span class="stat-label">指輪</span><span id="equip-ring-value" class="stat-value">なし</span></div>
        <div class="stat-row"><span class="stat-label">所持品</span><span id="equip-inventory-value" class="stat-value">薬×0  巻×0  飯×0</span></div>
      </section>

      <section class="panel-block hall-of-fame-panel" aria-label="殿堂">
        <h2>殿堂</h2>
        <div class="hall-of-fame-list" id="hall-of-fame-list"></div>
      </section>
    </aside>
  </main>

  <footer class="app-footer">
    <a href="https://github.com/sazanamix/kanji-roguelike-game" target="_blank" rel="noopener">GitHub</a>
    <span class="sep">・</span>
    <a href="https://sazanamix.github.io/github-pages/">sazanamix</a>
  </footer>

  <div class="overlay hidden" id="overlay">
    <div class="overlay-content">
      <h2 id="overlay-title">RESULT</h2>
      <p id="overlay-subtitle" class="overlay-subtitle"></p>
      <div id="overlay-body" class="overlay-body"></div>
      <button type="button" id="overlay-skip" class="btn">スキップ</button>
    </div>
  </div>

</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
